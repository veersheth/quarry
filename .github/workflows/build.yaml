name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Nix and points <nixpkgs> at nixpkgs-unstable, which matches
      # what shell.nix uses. The official binary cache (cache.nixos.org) is
      # enabled automatically, so packages like webkitgtk are downloaded as
      # pre-built binaries rather than compiled from source.
      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      # Cache the Nix store between runs so subsequent builds only fetch
      # packages that changed since the last shell.nix update.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('shell.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      # Cache the Rust target directory independently — it changes much more
      # often than the Nix store and benefits from its own cache key.
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Cache the pnpm content-addressable store so node_modules installs
      # are fast after the first run.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: nix-shell --run "pnpm install --frozen-lockfile"

      - name: Build Tauri app
        run: nix-shell --run "pnpm tauri build"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: quarry-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: quarry-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
