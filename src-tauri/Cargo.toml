[package]
name = "quarry"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "quarry"  

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon" ] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"  
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
desktopentries = "0.1.2"
freedesktop-desktop-entry = "0.7.14"
base64 = "0.22.1"
urlencoding = "2.1.3"
regex = "1.12.2"
lazy_static = "1.5.0"
meval = "0.2.0"
freedesktop-icons = "0.4.0"
once_cell = "1.21.3"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
arboard = "3.6.1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
emojis = "0.8.0"
fuzzy-matcher = "0.3"
rayon = "1.11.0"
dashmap = "6.1.0"
drag = "2"
image = "0.25.9"
toml = "1.1.2"
chrono-tz = "0.10.4"
chrono = "0.4.44"
unicode_names2 = "2.0.0"
unicode-general-category = "1.1.0"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[[bin]]
name = "quarry-toggle"
path = "src/bin/quarry-toggle.rs"

[[bin]]
name = "quarry-rofi"
path = "src/bin/quarry-rofi.rs"
